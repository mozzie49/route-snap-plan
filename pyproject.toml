[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "route-snap-plan"
version = "0.1.0"
description = "Offline Rails changed-file to screenshot-candidate planner with explicit uncertainty"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
route-snap-plan = "route_snap_plan:main"

[tool.setuptools]
py-modules = ["route_snap_plan"]
