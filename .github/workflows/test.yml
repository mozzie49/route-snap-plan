name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile route_snap_plan.py
      - run: python3 route_snap_plan.py --routes examples/routes.txt --changed examples/changed.txt --config examples/config.json --strict
